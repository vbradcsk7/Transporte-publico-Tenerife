version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: transit_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: transit_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SNAPSHOT_PATH=data/processed/graph_snapshot.json
      - CSV_PATH=data/raw/lineas-y-horarios.csv
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data
