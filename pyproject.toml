[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tenerife-transit-graph"
version = "0.1.0"
description = "MultiDiGraph transit network modeling, state-space multimodal routing and network science for Tenerife (TITSA)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "networkx>=3.2.0",
    "pydantic>=2.6.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "redis>=5.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.29.0",
]
